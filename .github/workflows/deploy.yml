name: Build check

# El deploy a Cloudflare Pages lo maneja la integración directa GitHub → Pages.
# Este workflow solo verifica que el build pase en cada push.

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ysxqrpgtwsmywcfjuxxr

      - name: Show build output structure
        run: |
          echo "=== dist/ ==="
          ls -la dist/ 2>/dev/null || echo "no dist/"
          echo "=== dist/server/ ==="
          ls -la dist/server/ 2>/dev/null || echo "no dist/server/"
          echo "=== dist/client/ ==="
          ls -la dist/client/ 2>/dev/null || echo "no dist/client/"
          echo "=== dist/server/wrangler.json ==="
          cat dist/server/wrangler.json 2>/dev/null || echo "no wrangler.json"
